# coturn configuration for the emulator's ICE stack (STUN + TURN).
# Copy to turnserver.conf and adjust:
#   realm         - any string; must match what clients present (the ICE transport
#                   sends the TURN user name only, so any realm works with lt-cred-mech)
#   user          - "username:password" for long-term credential mechanism
#   external-ip   - the server's public IP as seen from the internet
#                   (or use DETECT_EXTERNAL_IP=yes in docker-compose.yml)
#
# ICE/TURN specifics:
#   - The emulator's ICE transport talks TURN over UDP by default (the "turn:" scheme),
#     so the plain listening-port (3478/udp) is what matters. tls-listening-port is optional.
#   - min/max-port bound the UDP range TURN allocates for relayed traffic;
#     every port in the range must be reachable from the clients (see README.md).

listening-port=3478
tls-listening-port=5349

fingerprint
lt-cred-mech
realm=my-realm
user=myuser:mypass

# UDP range used for relayed (TURN) sessions.
# In a full-mesh P2P session of N players where all peers rely on TURN,
# up to N*(N-1) ports are allocated (e.g. 20 players = ~380 allocations).
# A range of 1000-2000 ports (e.g. 49152-51152) comfortably handles 20+ concurrent
# players with room for reconnects and stale allocation expiration.
min-port=47000
max-port=49999

# Public IP of this server, e.g. 203.0.113.10. With Docker's host network and
# DETECT_EXTERNAL_IP=yes this is discovered automatically instead.
external-ip=203.0.113.10

no-cli
no-multicast-peers
log-file=stdout
#Verbose
